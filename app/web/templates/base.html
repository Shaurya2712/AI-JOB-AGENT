<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A local-first job search dashboard.">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="Job Agent dashboard">
          <span class="brand__mark" aria-hidden="true">JA</span>
          <span>Job Agent</span>
        </a>
        <nav aria-label="Primary navigation">
          <ul class="nav-list">
            <li><a href="/"{% if active_nav == "dashboard" %} aria-current="page"{% endif %}>Dashboard</a></li>
            <li><span aria-disabled="true">Jobs</span></li>
            <li><a href="/profiles"{% if active_nav == "profiles" %} aria-current="page"{% endif %}>Profiles</a></li>
            <li><span aria-disabled="true">Companies</span></li>
            <li><span aria-disabled="true">Scans</span></li>
            <li><span aria-disabled="true">Settings</span></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main-content" class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>Local-first · Single user</span>
        <span>Job Agent V1</span>
      </div>
    </footer>
  </body>
</html>
